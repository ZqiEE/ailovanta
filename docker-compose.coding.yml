services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      AILOVANTA_PROJECT_ROOT: /app/runtime_data/coding_projects
      AILOVANTA_ENV: production
      AILOVANTA_REQUIRE_NODE_PROOF: "true"
    volumes:
      - ailovanta_data:/app/runtime_data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ailovanta_data:
  ollama_data:
