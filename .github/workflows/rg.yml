name: RG

on:
  push:
  pull_request:

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  rg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Compile product code
        run: python -m compileall -q api node_client scripts
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Verify coding product routes
        run: |
          python - <<'PY'
          from api.product_app import app
          paths = {route.path for route in app.routes}
          required = {"/", "/app", "/coding/status", "/coding/projects"}
          missing = required - paths
          if missing:
              raise SystemExit(f"missing product routes: {sorted(missing)}")
          print("coding product routes ready")
          PY
