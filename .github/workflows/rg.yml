name: RG

on:
  push:
  pull_request:

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  rg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Compile product code
        run: python -m compileall -q api node_client scripts
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Verify coding and network routes
        run: |
          python - <<'PY'
          from api.product_app import app
          paths = {route.path for route in app.routes}
          required = {
              "/", "/app", "/coding/status", "/coding/privacy", "/coding/cost", "/coding/projects",
              "/nodes/register", "/nodes/heartbeat", "/network/status", "/jobs/next", "/jobs/result", "/jobs/public-inference",
          }
          missing = required - paths
          if missing:
              raise SystemExit(f"missing product routes: {sorted(missing)}")
          print("coding + distributed control-plane routes ready")
          PY
      - name: Verify local launcher imports
        run: |
          python -c "from node_client.local_runtime import main; from node_client.model_profile import recommend_local_model; print('local launcher ready')"
          bash -n start-local.sh
      - name: Validate production compose
        run: |
          docker compose -f docker-compose.coding.yml config -q
          AILOVANTA_DOMAIN=code.example.com docker compose -f docker-compose.coding.yml --profile public config -q
          docker compose -f docker-compose.coding.yml -f docker-compose.gpu.yml config -q
          AILOVANTA_DOMAIN=code.example.com docker compose -f docker-compose.control.yml config -q
      - name: Build lean production image
        run: docker build -t ailovanta-coding-ci .
      - name: Smoke import lean production image
        run: docker run --rm ailovanta-coding-ci python -c "from api.product_app import app; print(app.title)"
      - name: Smoke control-plane front page selection
        run: docker run --rm -e AILOVANTA_RUNTIME_MODE=control-plane ailovanta-coding-ci python -c "from api.product_app import _front_page; p=_front_page(); assert p.name == 'control.html' and p.exists(); print(p)"
